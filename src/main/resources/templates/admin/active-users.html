<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{active-users.page.title}">Active User List</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body class="bg-light text-dark">

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <div class="d-flex align-items-center">
            <a class="navbar-brand mr-3" th:text="#{all.app.title}">Travel Agency</a>
            <a th:href="@{/}" class="nav-link" th:text="#{all.navbar.home}">Home</a>
        </div>
        <div class="ml-auto">
            <a href="/api/auth/sign-out" class="btn btn-outline-danger m-2" th:text="#{all.button.sign-out}">Sign Out</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>

    <h2 class="text-center mb-4" th:text="#{user-list.page.header}">List of Users</h2>

    <table class="table table-bordered table-hover bg-white">
        <thead class="thead-light">
        <tr>
            <th th:text="#{users.column.id}">ID</th>
            <th th:text="#{users.column.username}">Username</th>
            <th th:text="#{users.column.phone}">Phone</th>
            <th th:text="#{users.column.balance}">Balance</th>
            <th th:text="#{users.column.action}">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${activeUsers}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.phoneNumber != null ? user.phoneNumber : '-'}"></td>
            <td th:text="${user.balance != null ? user.balance : '-'}"></td>
            <td>
                <form th:if="${user.role != 'ADMIN'}" th:action="@{/api/admin/users/block/{id}(id=${user.id})}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm" th:text="#{active-users.button.block}">Block</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(activeUsers)}">
            <td colspan="5" class="text-center text-muted py-4 font-italic" th:text="#{users.page.no-results}">No users found</td>
        </tr>
        </tbody>

    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
