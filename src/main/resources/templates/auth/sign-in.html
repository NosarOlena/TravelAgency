<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{sign-in.page.title}">Sign in Page</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <div class="d-flex align-items-center">
            <a class="navbar-brand mr-3" th:text="#{all.app.title}">Travel Agency</a>
            <a th:href="@{/}" class="nav-link" th:text="#{all.navbar.home}">Home</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 th:text="#{sign-in.page.header}">Sign in</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/api/auth/sign-in}" method="post" th:object="${loginRequest}">
        <div class="form-group">
            <label for="username" th:text="#{sign-in.username.label}">Username</label>
            <input th:field="*{username}" type="text" class="form-control" id="username"
                   th:placeholder="#{sign-in.username.placeholder}" required>
        </div>
        <div class="form-group">
            <label for="password" th:text="#{sign-in.password.label}">Password</label>
            <input th:field="*{password}" type="password" class="form-control" id="password"
                   th:placeholder="#{sign-in.password.placeholder}" required>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{sign-in.button}">Sign in</button>
    </form>
</div>
</body>
</html>
