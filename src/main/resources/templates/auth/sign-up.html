<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{sign-up.page.title}">Sign Up Page</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <div class="d-flex align-items-center">
            <a class="navbar-brand mr-3" th:text="#{all.app.title}">Travel Agency</a>
            <a th:href="@{/}" class="nav-link" th:text="#{all.navbar.home}">Home</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 th:text="#{sign-up.page.header}">Sign Up</h2>

    <form th:action="@{/api/auth/sign-up}" th:object="${registerRequest}" method="post">
        <div class="form-group">
            <label for="username" th:text="#{sign-up.username.label}">Username</label>
            <input th:field="*{username}" type="text" class="form-control" id="username"
                   th:placeholder="#{sign-up.username.placeholder}" required>

            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username error</div>

            <div class="text-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        </div>


        <div class="form-group">
            <label for="password" th:text="#{sign-up.password.label}">Password</label>
            <input th:field="*{password}" type="password" class="form-control" id="password"
                   th:placeholder="#{sign-up.password.placeholder}" required>

            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
        </div>

        <div class="form-group">
            <label for="phone" th:text="#{sign-up.phone.label}">Phone Number (Optional)</label>
            <input th:field="*{phoneNumber}" type="text" class="form-control" id="phone"
                   th:placeholder="#{sign-up.phone.placeholder}">

            <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">Phone number error</div>
        </div>

        <button type="submit" class="btn btn-primary" th:text="#{sign-up.button}">Sign Up</button>
    </form>
</div>
</body>
</html>
