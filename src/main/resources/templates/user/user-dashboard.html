<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{user-dashboard.page.title}">Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body class="bg-light text-dark">

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:text="#{all.app.title}">Travel Agency</a>
        <div class="ml-auto">
            <a href="/api/user/me" class="btn btn-outline-primary" th:text="#{user-dashboard.button.view-profile}">View My Profile</a>
            <a href="/api/auth/sign-out" class="btn btn-outline-danger m-2" th:text="#{all.button.sign-out}">Sign Out</a>
        </div>
    </div>
</nav>

<h1 class="text-center my-4" th:text="#{user-dashboard.page.header}">Dashboard</h1>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>

    <form id="filterForm" th:action="@{/api/user/dashboard}" method="get">
        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="title" th:text="#{user-dashboard.filter.title}">Title</label>
                <input type="text" id="title" class="form-control" name="title" th:value="${title}" th:placeholder="#{user-dashboard.filter.title-placeholder}">
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="description" th:text="#{user-dashboard.filter.description}">Description</label>
                <input type="text" id="description" class="form-control" name="description" th:value="${description}" th:placeholder="#{user-dashboard.filter.description-placeholder}">
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="tourType" th:text="#{user-dashboard.filter.tour-type}">Tour Type</label>
                <select id="tourType" class="form-control" name="tourType">
                    <option value="" th:text="#{user-dashboard.filter.all}">All</option>
                    <option th:each="type : ${tourTypes}" th:value="${type}" th:text="${type}" th:selected="${type == tourType}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="transferType" th:text="#{user-dashboard.filter.transfer-type}">Transfer Type</label>
                <select id="transferType" class="form-control" name="transferType">
                    <option value="" th:text="#{user-dashboard.filter.all}">All</option>
                    <option th:each="type : ${transferTypes}" th:value="${type}" th:text="${type}" th:selected="${type == transferType}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="hotelType" th:text="#{user-dashboard.filter.hotel-type}">Hotel Type</label>
                <select id="hotelType" class="form-control" name="hotelType">
                    <option value="" th:text="#{user-dashboard.filter.all}">All</option>
                    <option th:each="type : ${hotelTypes}" th:value="${type}" th:text="${type}" th:selected="${type == hotelType}"></option>
                </select>
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="arrivalFrom" th:text="#{user-dashboard.filter.arrival-date-from}">Arrival From</label>
                <input type="date" id="arrivalFrom" class="form-control" name="arrivalFrom" th:value="${arrivalFrom}">
            </div>
            <div class="col-md-3">
                <label for="evictionTo" th:text="#{user-dashboard.filter.eviction-date-to}">Eviction To</label>
                <input type="date" id="evictionTo" class="form-control" name="evictionTo" th:value="${evictionTo}">
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="minPrice" th:text="#{user-dashboard.filter.min-price}">Min Price</label>
                <input type="number" id="minPrice" class="form-control" step="0.01" name="minPrice" th:value="${minPrice}" th:placeholder="#{user-dashboard.min-price.placeholder}">
            </div>
            <div class="col-md-3">
                <label for="maxPrice" th:text="#{user-dashboard.filter.max-price}">Max Price</label>
                <input type="number" id="maxPrice" class="form-control" step="0.01" name="maxPrice" th:value="${maxPrice}" th:placeholder="#{user-dashboard.max-price.placeholder}">
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-6 text-center">
                <button type="submit" class="btn btn-outline-primary" th:text="#{user-dashboard.button.filter}">Filter</button>
            </div>
        </div>
    </form>

    <table class="table table-bordered table-hover bg-white">
        <thead class="thead-light">
        <tr>
            <th th:text="#{user-dashboard.column.id}">ID</th>
            <th th:text="#{user-dashboard.column.title}">Title</th>
            <th th:text="#{user-dashboard.column.description}">Description</th>
            <th th:text="#{user-dashboard.column.price}">Price</th>
            <th th:text="#{user-dashboard.column.tour-type}">Tour Type</th>
            <th th:text="#{user-dashboard.column.transfer-type}">Transfer Type</th>
            <th th:text="#{user-dashboard.column.hotel-type}">Hotel Type</th>
            <th th:text="#{user-dashboard.column.arrival-date}">Arrival Date</th>
            <th th:text="#{user-dashboard.column.eviction-date}">Eviction Date</th>
            <th th:text="#{user-dashboard.column.hot-status}">Hot Status</th>
            <th th:text="#{user-dashboard.column.action}">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="voucher : ${vouchers}">
            <td th:text="${voucher.id}"></td>
            <td th:text="${voucher.title}"></td>
            <td th:text="${voucher.description}"></td>
            <td th:text="${voucher.price}"></td>
            <td th:text="${voucher.tourType}"></td>
            <td th:text="${voucher.transferType}"></td>
            <td th:text="${voucher.hotelType}"></td>
            <td style="white-space: nowrap;" th:text="${#temporals.format(voucher.arrivalDate, 'yyyy-MM-dd')}"></td>
            <td style="white-space: nowrap;" th:text="${#temporals.format(voucher.evictionDate, 'yyyy-MM-dd')}"></td>
            <td class="text-center" th:text="${voucher.isHot != null ? (voucher.isHot ? '+' : '-') : 'N/A'}"></td>
            <td>
                <form th:action="@{/api/user/order/{voucherId}(voucherId=${voucher.id})}" method="post">
                    <button type="submit" class="btn btn-outline-success" th:text="#{user-dashboard.button.order}">Order</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(vouchers)}">
            <td colspan="9" class="text-center text-muted py-4 font-italic" th:text="#{user-dashboard.page.no-results}">No vouchers found.</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
