<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{all-vouchers.page.title}">List of Vouchers</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body class="bg-light text-dark">

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:text="#{all.app.title}">Travel Agency</a>
        <a th:href="@{/}" class="navbar-link" th:text="#{all.navbar.home}">Home</a>
        <div class="ml-auto">
            <a href="/api/auth/sign-out" class="btn btn-outline-danger m-2" th:text="#{all.button.sign-out}">Sign Out</a>
        </div>
    </div>
</nav>

<h1 class="text-center my-4" th:text="#{all-vouchers.page.header}">List of Vouchers</h1>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>

    <form id="filterForm" th:action="@{/api/manager/vouchers}" method="get">
        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="title" th:text="#{all-vouchers.filter.title}">Title</label>
                <input type="text" id="title" class="form-control" name="title" th:value="${title}" th:placeholder="#{all-vouchers.filter.title-placeholder}">
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="description" th:text="#{all-vouchers.filter.description}">Description</label>
                <input type="text" id="description" class="form-control" name="description" th:value="${description}" th:placeholder="#{all-vouchers.filter.description-placeholder}">
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="tourType" th:text="#{all-vouchers.filter.tour-type}">Tour Type</label>
                <select id="tourType" class="form-control" name="tourType">
                    <option value="" th:text="#{all-vouchers.filter.all}">All</option>
                    <option th:each="type : ${tourTypes}" th:value="${type}" th:text="${type}" th:selected="${type == tourType}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="transferType" th:text="#{all-vouchers.filter.transfer-type}">Transfer Type</label>
                <select id="transferType" class="form-control" name="transferType">
                    <option value="" th:text="#{all-vouchers.filter.all}">All</option>
                    <option th:each="type : ${transferTypes}" th:value="${type}" th:text="${type}" th:selected="${type == transferType}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="hotelType" th:text="#{all-vouchers.filter.hotel-type}">Hotel Type</label>
                <select id="hotelType" class="form-control" name="hotelType">
                    <option value="" th:text="#{all-vouchers.filter.all}">All</option>
                    <option th:each="type : ${hotelTypes}" th:value="${type}" th:text="${type}" th:selected="${type == hotelType}"></option>
                </select>
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="status" th:text="#{all-vouchers.filter.status}">Status</label>
                <select id="status" class="form-control" name="status">
                    <option value="" th:text="#{all-vouchers.filter.all}">All</option>
                    <option th:each="statusItem : ${voucherStatuses}" th:value="${statusItem}" th:text="${statusItem}" th:selected="${statusItem == status}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="hotStatus" th:text="#{all-vouchers.filter.hot-status}">Hot Status</label>
                <select id="hotStatus" class="form-control" name="hotStatus">
                    <option value="" th:text="#{all-vouchers.filter.all}">All</option>
                    <option value="true" th:text="#{all-vouchers.filter.hot-status-true}" th:selected="${hotStatus != null and hotStatus}">Hot</option>
                    <option value="false" th:text="#{all-vouchers.filter.hot-status-false}" th:selected="${hotStatus != null and not hotStatus}">Regular</option>
                </select>
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="arrivalFrom" th:text="#{all-vouchers.filter.arrival-date-from}">Arrival From</label>
                <input type="date" id="arrivalFrom" class="form-control" name="arrivalFrom" th:value="${arrivalFrom}">
            </div>
            <div class="col-md-3">
                <label for="evictionTo" th:text="#{all-vouchers.filter.eviction-date-to}">Eviction To</label>
                <input type="date" id="evictionTo" class="form-control" name="evictionTo" th:value="${evictionTo}">
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-3">
                <label for="minPrice" th:text="#{all-vouchers.filter.min-price}">Min Price</label>
                <input type="number" id="minPrice" class="form-control" step="0.01" name="minPrice" th:value="${minPrice}" th:placeholder="#{all-vouchers.min-price.placeholder}">
            </div>
            <div class="col-md-3">
                <label for="maxPrice" th:text="#{all-vouchers.filter.max-price}">Max Price</label>
                <input type="number" id="maxPrice" class="form-control" step="0.01" name="maxPrice" th:value="${maxPrice}" th:placeholder="#{all-vouchers.max-price.placeholder}">
            </div>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-6 text-center">
                <button type="submit" class="btn btn-outline-primary" th:text="#{all-vouchers.button.filter}">Filter</button>
            </div>
        </div>
    </form>

    <table class="table table-bordered table-hover bg-white">
        <thead class="thead-light">
        <tr>
            <th th:text="#{all-vouchers.column.id}">ID</th>
            <th th:text="#{all-vouchers.column.description}">Description</th>
            <th th:text="#{all-vouchers.column.title}">Title</th>
            <th th:text="#{all-vouchers.column.price}">Price</th>
            <th th:text="#{all-vouchers.column.tour-type}">Tour Type</th>
            <th th:text="#{all-vouchers.column.transfer-type}">Transfer Type</th>
            <th th:text="#{all-vouchers.column.hotel-type}">Hotel Type</th>
            <th th:text="#{all-vouchers.column.arrival-date}">Arrival Date</th>
            <th th:text="#{all-vouchers.column.eviction-date}">Eviction Date</th>
            <th th:text="#{all-vouchers.column.hot-status}">Hot Status</th>
            <th th:text="#{all-vouchers.column.status}">Status</th>
            <th th:text="#{all-vouchers.column.action}">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="voucher : ${vouchers}">
            <td th:text="${voucher.id}"></td>
            <td th:text="${voucher.title}"></td>
            <td th:text="${voucher.description}"></td>
            <td th:text="${voucher.price}"></td>
            <td th:text="${voucher.tourType}"></td>
            <td th:text="${voucher.transferType}"></td>
            <td th:text="${voucher.hotelType}"></td>
            <td style="white-space: nowrap;" th:text="${#temporals.format(voucher.arrivalDate, 'yyyy-MM-dd')}"></td>
            <td style="white-space: nowrap;" th:text="${#temporals.format(voucher.evictionDate, 'yyyy-MM-dd')}"></td>
            <td class="text-center" th:text="${voucher.isHot != null ? (voucher.isHot ? '+' : '-') : 'N/A'}"></td>
            <td th:text="${voucher.status}"></td>
            <td class="d-flex flex-column align-items-center">
                <form th:action="@{/api/manager/vouchers/change-hot-status/{voucherId}(voucherId=${voucher.id})}" method="post" class="mb-2">
                    <button type="submit" class="btn btn-outline-warning" th:text="#{all-vouchers.button.change-hot-status}">Change Hot Status</button>
                </form>

                <form th:if="${voucher.status.toString() == statusForChange.toString()}" th:action="@{/api/manager/vouchers/change-status/{voucherId}(voucherId=${voucher.id})}" method="post" class="mb-2">
                    <label for="newStatus" th:text="#{all-vouchers.change-status.label}">New Status</label>
                    <select id="newStatus" class="form-control" name="newStatus">
                        <option th:each="status : ${availableStatuses}" th:value="${status}" th:text="${status}"></option>
                    </select>
                    <button type="submit" class="btn btn-outline-info mt-2" th:text="#{all-vouchers.button.change-status}">Change Status</button>
                </form>
            </td>


        </tr>
        <tr th:if="${#lists.isEmpty(vouchers)}">
            <td colspan="9" class="text-center text-muted py-4 font-italic" th:text="#{all-vouchers.page.no-results}">No vouchers found.</td>
        </tr>
        </tbody>
    </table>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
